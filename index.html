<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EMT Quest</title>
<style>
:root{--bg:#0b1220;--panel:#131f30;--teal:#5de5d0;
--text:#f1f5f9;--muted:#91a7ba}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
font-family:system-ui,sans-serif}
main{max-width:760px;margin:auto;padding:22px}
header,.stats,.categories,.options{display:grid;gap:12px}
header{grid-template-columns:1fr auto;align-items:center}
h1{color:var(--teal);margin-bottom:4px}
p{line-height:1.7}
small,.muted{color:var(--muted)}
.stats{grid-template-columns:1fr 1fr;margin:22px 0}
.card,.panel{background:var(--panel);border-radius:16px;
padding:18px;border:1px solid #263649}
.categories{grid-template-columns:repeat(2,minmax(0,1fr))}
button{font:inherit;cursor:pointer}
.category,.option,.primary{border:1px solid #34465a;
background:#182638;color:var(--text);border-radius:12px;
padding:14px;text-align:left}
.category:hover,.option:hover{border-color:var(--teal)}
.primary{background:var(--teal);color:#0b1220;
text-align:center;font-weight:700;width:100%}
.option.selected{border-color:var(--teal);
background:#123a46}
.option.correct{border-color:#39c99a;background:#123a35}
.option.wrong{border-color:#fb7185;background:#401f2b;
animation:shake .25s}
.bar{height:7px;background:#263649;border-radius:9px;
overflow:hidden;margin:12px 0}
#progress{height:100%;background:var(--teal);width:0;
transition:width .35s}
.hidden{display:none}
#feedback{margin:16px 0;padding:16px;border-radius:12px;
background:#182638;line-height:1.8}
#feedback.good{border:1px solid #39c99a}
#feedback.bad{border:1px solid #fb7185}
@keyframes shake{25%{transform:translateX(-3px)}
75%{transform:translateX(3px)}}
@media(max-width:480px){main{padding:14px}
.categories{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
<header>
  
<div><h1>🩺 MED QUEST</h1>
  <small>MEDICAL QUIZZES & VOCABULARY</small></div>
</header>

<section class="stats">
  <div class="card"><small>TOTAL XP</small>
    <h2 id="xp">0 XP</h2><div class="bar">
    <div id="xpbar" style="height:100%;background:var(--teal);
    width:0"></div></div>
    <small id="next">100 XP to next level</small>
  </div>
  <div class="card"><small>BADGES</small>
    <h2 id="badges">🏅 0</h2>
    <small id="badgeText">เริ่มภารกิจแรกของคุณ</small>
  </div>
</section>

<section id="home">
  <h2>เลือกภารกิจ</h2>
  <div class="categories" id="categories"></div>
</section>

<section id="quiz" class="hidden">
  <button id="back" class="category">← กลับหน้าหลัก</button>
  <p class="muted" id="categoryName"></p>
  <div class="bar"><div id="progress"></div></div>
  <small id="count"></small>
  <div class="panel">
    <h3 id="question"></h3>
    <p id="prompt"></p>
    <div class="options" id="options"></div>
    <div id="feedback" class="hidden"></div>
    <button id="submit" class="primary">ส่งคำตอบ</button>
    <button id="nextQ" class="primary hidden"
      style="margin-top:10px">ข้อถัดไป →</button>
  </div>
</section>
</main>

"continuous- ต่อเนื่อง; bleeding- การมีเลือดออก",
" มีเลือดออกติดต่อกันเป็นระยะเวลานานกว่าปกติ ต้องรีบห้ามเลือด"],
["Hydrocephalus","ทารกมีศีรษะโตขึ้นผิดปกติจากการระบายของน้ำไขสันหลังที่ผิดปกติ ภาวะนี้เรียกว่าอะไร",
 "ภาวะน้ำไขสันหลังคั่งในโพรงสมอง",
 "hydro-  น้ำ; cephalus- ศีรษะ",
 "น้ำคั่งในโพรงสมอง จนโพรงสมองขยาย"],
["Hydrothorax","ผู้ป่วยมีภาวะหายใจลำบากจากของเหลวที่สะสมอยู่รอบปอด ภาวะนี้เรียกว่าอะไร",
 "ภาวะมีของเหลวสะสมในช่องเยื่อหุ้มปอด",
 "hydro-  น้ำหรือของเหลว; thorax- ทรวงอก",
 "นึกถึงของเหลวคั่งอยู่รอบปอด"]
 ]}
];

let xp=0,correct=0,answered=0,earnedBadges=[];
let active=null,index=0,selected=-1,locked=false;

const $=id=>document.getElementById(id);
const shuffle=a=>[...a].sort(()=>Math.random()-.5);

function renderHome(){
 $("home").classList.remove("hidden");
 $("quiz").classList.add("hidden");
 $("categories").innerHTML=categories.map((c,i)=>
 `<button class="category" data-cat="${i}">
 <h3>${c.icon} ${c.name}</h3>
 <small>${i===3?"เคสจำลอง":c.terms.length+" คำศัพท์"}</small>
 </button>`).join("");
 document.querySelectorAll("[data-cat]").forEach(b=>
 b.onclick=()=>start(+b.dataset.cat));
 updateStats();
}

function start(i){
 active=categories[i];index=0;correct=0;answered=0;
 selected=-1;locked=false;
 // คืนการทำงานของปุ่มข้อถัดไปทุกครั้งที่เริ่มภารกิจใหม่
 $("nextQ").onclick=next;
 // รวมศัพท์ทุกหมวดและตัดคำซ้ำ
 const allTerms=[
  ...new Map(
   categories.flatMap(c=>c.terms).map(t=>[t[0],t])
  ).values()
 ];

 active.questions=shuffle(active.terms).map(t=>{
  const wrong=shuffle(
   allTerms.filter(x=>x[0]!==t[0])
  ).slice(0,3).map(x=>x[0]);

  return {t,opts:shuffle([t[0],...wrong])};
 });

 $("home").classList.add("hidden");
 $("quiz").classList.remove("hidden");
 $("categoryName").textContent=active.name;
 showQuestion();
}

function showQuestion(){
 selected=-1;locked=false;
 const item=active.questions[index],t=item.t;
 $("count").textContent=`ข้อ ${index+1} / ${active.questions.length}`;
 $("progress").style.width=(index/active.questions.length*100)+"%";
 $("question").textContent=t[1];
 $("prompt").textContent="ศัพท์ใดตรงกับอาการนี้มากที่สุด?";
 $("feedback").className="hidden";
 $("feedback").textContent="";
 $("options").innerHTML=item.opts.map((o,i)=>
 `<button class="option" data-opt="${i}">${String.fromCharCode(65+i)}. ${o}</button>`
 ).join("");
 document.querySelectorAll("[data-opt]").forEach(b=>b.onclick=()=>{
  if(locked)return;
  selected=+b.dataset.opt;
  document.querySelectorAll(".option").forEach(x=>
   x.classList.toggle("selected",x===b));
 });
 $("submit").classList.remove("hidden");
 $("nextQ").classList.add("hidden");
}
function updateStats(){
 const level=Math.floor(xp/100)+1,progress=xp%100;
 $("xp").textContent=xp+" XP";
 $("xpbar").style.width=progress+"%";
 $("next").textContent=(100-progress)+" XP to next level";
 $("badges").textContent="🏅 "+earnedBadges.length;
 $("badgeText").textContent=earnedBadges.join(" · ")||"เริ่มภารกิจแรกของคุณ";
}
function submit(){
 if(selected<0||locked)return;
 locked=true;answered++;
 const item=active.questions[index],t=item.t;
 const answer=item.opts[selected],isCorrect=answer===t[0];
 const buttons=[...document.querySelectorAll(".option")];
 buttons.forEach((b,i)=>{
  b.disabled=true;
  if(item.opts[i]===t[0])b.classList.add("correct");
  else if(i===selected)b.classList.add("wrong");
 });
 if(isCorrect){correct++;xp+=10;}
 $("feedback").className=isCorrect?"good":"bad";
 $("feedback").classList.remove("hidden");
 $("feedback").innerHTML=`<strong>${isCorrect?"✓ ถูกต้อง! +10 XP":"✕ ยังไม่ถูก คำตอบคือ "+t[0]}</strong><br>
 <b>ความหมาย:</b> ${t[2]}<br>
 <b>รากศัพท์:</b> ${t[3]}<br>
 <b>เทคนิคจำ:</b> ${t[4]}`;
 // เหรียญสะสมตาม XP รวม จึงปลดล็อกเพิ่มได้ข้ามหลายภารกิจ
 if(xp>=10&&!earnedBadges.includes("First Response"))
  earnedBadges.push("First Response");
 if(xp>=50&&!earnedBadges.includes("Quick Thinker"))
  earnedBadges.push("Quick Thinker");
 if(xp>=100&&!earnedBadges.includes("Field Medic"))
  earnedBadges.push("Field Medic");
 if(xp>=200&&!earnedBadges.includes("EMT Expert"))
  earnedBadges.push("EMT Expert");
 updateStats();
 $("submit").classList.add("hidden");
 $("nextQ").classList.remove("hidden");
 $("nextQ").textContent=index===active.questions.length-1?
 "ดูผลภารกิจ":"ข้อถัดไป →";
}


function next(){
 if(index<active.questions.length-1){
  index++;
  showQuestion();
  return;
 }

 $("progress").style.width="100%";
 updateStats();

 $("question").textContent="ภารกิจเสร็จสิ้น! 🎉";
 $("prompt").textContent=`ตอบถูก ${correct} จาก ${answered} ข้อ`;
 $("options").innerHTML="";

 $("feedback").className="good";
 $("feedback").classList.remove("hidden");
 $("feedback").innerHTML=
  `<strong>ภารกิจเสร็จสิ้น!</strong><br>`+
  `TOTAL XP: ${xp} XP<br>`+
  `เหรียญรางวัล: ${earnedBadges.join(", ")||"ยังไม่มี"}`;

 $("submit").classList.add("hidden");
 $("nextQ").classList.remove("hidden");
  $("nextQ").textContent="กลับหน้าหลัก";
 $("nextQ").onclick=()=>{
  $("home").classList.remove("hidden");
  $("quiz").classList.add("hidden");
  renderHome();
 };
}
$("submit").onclick=submit;
$("nextQ").onclick=next;
$("back").onclick=renderHome;
renderHome();
</script>
</body>
</html>
